{% extends "base.html" %}

{% block title %}Your Cart - Foodie Express{% endblock %}

{% block start %}
<section class="page-hero">
    <div class="container">
        <div class="breadcrumb-line">
            <a href="/">Home</a>
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
            <span>Cart</span>
        </div>
        <div class="page-hero-row">
            <div>
                <h1 class="page-title">Your cart</h1>
                <p class="page-subtitle">Review your dishes, choose a delivery address, and check out securely.</p>
            </div>
            <div class="page-actions">
                <a href="/all-items/" class="btn btn-outline btn-sm"><i class="fas fa-plus" aria-hidden="true"></i> Add more items</a>
            </div>
        </div>
    </div>
</section>

<section class="section section-sm">
    <div class="container">
        <div id="cart-main">
            {% include 'cart_content.html' %}
        </div>
    </div>
</section>
{% endblock %}
