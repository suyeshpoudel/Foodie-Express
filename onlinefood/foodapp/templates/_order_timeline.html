<div class="timeline" aria-label="Order progress">
    {% for step in status_flow %}
    <div class="timeline-step{% if order.status != 'Cancel' and forloop.counter0 < order.status_index %} is-done{% elif order.status != 'Cancel' and forloop.counter0 == order.status_index %} is-current{% endif %}">
        <span class="timeline-dot">
            {% if order.status != 'Cancel' and forloop.counter0 < order.status_index %}
            <i class="fas fa-check" aria-hidden="true"></i>
            {% else %}
            {{ forloop.counter }}
            {% endif %}
        </span>
        <span class="timeline-label">{{ step }}</span>
        <span class="timeline-connector" aria-hidden="true"></span>
    </div>
    {% endfor %}
</div>
{% if order.status == 'Cancel' %}
<div class="cancelled-note"><i class="fas fa-circle-xmark" aria-hidden="true"></i> This order has been cancelled.</div>
{% endif %}
