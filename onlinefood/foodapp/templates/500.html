{% extends "base.html" %}

{% block title %}Server Error - Foodie Express{% endblock %}

{% block start %}
<section class="state-page section">
    <div class="container">
        <div class="state-card">
            <span class="state-card__icon state-card__icon--danger"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i></span>
            <div class="state-code">Error 500</div>
            <h1>Something went wrong.</h1>
            <p>We could not finish that request. Please try again in a moment, or head back to the menu and start fresh.</p>
            <div class="state-actions">
                <a href="/" class="btn btn-brand"><i class="fas fa-house" aria-hidden="true"></i> Go home</a>
                <a href="/all-items/" class="btn btn-outline"><i class="fas fa-utensils" aria-hidden="true"></i> Browse the menu</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
